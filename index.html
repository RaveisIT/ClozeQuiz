<title>Cloze Knowledge Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: single centered question column; Raveis and Cloze logos side by side in the top row on every screen.
   Single light theme by choice: the Cloze logo ships on a white square, so the page ground stays white. */
:root {
  --bg: #ffffff;
  --surface: #f4f8fb;
  --ink: #14232f;
  --muted: #5b6b78;
  --line: #d5e1ea;
  --accent: #3a85b9;
  --accent-dark: #276797;
  --good: #1d7a4a;
  --good-bg: #e3f4EA;
  --bad: #b3261e;
  --bad-bg: #fbe9e7;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  margin: 0;
}
.app {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px;
  max-width: 980px;
  margin: 0 auto;
}
.top {
  display: flex; justify-content: center; align-items: center; gap: 36px;
  padding-top: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.logo-raveis { width: 300px; height: auto; display: block; }
.bottom { display: flex; justify-content: center; padding-top: 24px; }
.logo-cloze { width: 110px; height: auto; display: block; }

main { flex: 1; width: 100%; max-width: 720px; margin: 0 auto; padding-block: 24px; min-width: 0; text-align: center; }

.eyebrow { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-dark); font-weight: 600; margin: 0 0 8px; }
h1, h2 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0 0 16px; }
h1 { font-size: clamp(30px, 6vw, 44px); }
h2 { font-size: clamp(22px, 4.2vw, 30px); }
p { margin: 0 0 16px; }
.lede { color: var(--muted); font-size: 19px; }

.btn {
  font: inherit; font-weight: 600; cursor: pointer;
  background: var(--accent); color: #fff; border: 2px solid var(--accent);
  padding: 12px 26px; border-radius: 6px; min-height: 48px;
  transition: background .15s, transform .1s;
  text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
}
.btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn:active { transform: translateY(1px); }
.btn.center-btn { display: flex; width: max-content; margin: 28px auto 0; }
.btn.ghost { background: transparent; color: var(--accent-dark); }
.btn.ghost:hover { background: var(--surface); }
:focus-visible { outline: 3px solid #f2a900; outline-offset: 2px; }

.progress { display: flex; flex-direction: column-reverse; align-items: stretch; gap: 8px; margin-bottom: 24px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .35s ease; }
.count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

.options { list-style: none; margin: 24px 0; padding: 0; display: grid; gap: 12px; }
.opt {
  width: 100%; text-align: center; font: inherit; color: var(--ink); cursor: pointer;
  display: flex; gap: 14px; align-items: flex-start;
  background: var(--bg); border: 2px solid var(--line); border-radius: 8px;
  padding: 14px 16px; min-height: 56px;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--surface); }
.opt .letter {
  flex: none; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 700; font-size: 14px;
  background: var(--surface); color: var(--accent-dark); border: 1px solid var(--line);
}
.opt .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; padding-top: 3px; padding-right: 44px; }
.opt:disabled { cursor: default; }
.opt.correct { border-color: var(--good); background: var(--good-bg); }
.opt.correct .letter { background: var(--good); color: #fff; border-color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .letter { background: var(--bad); color: #fff; border-color: var(--bad); }
.opt.dim { opacity: .55; }
.opt.reveal { animation: pulse .9s ease 2; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(29,122,74,.25); } }

.feedback { min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
.msg { font-weight: 600; font-size: 19px; margin: 0; }
.msg.good { color: var(--good); }
.msg.bad { color: var(--bad); }
.msg small { display: block; font-weight: 400; font-size: 15px; color: var(--muted); }
.cheer { animation: pop .5s cubic-bezier(.2,1.6,.4,1); display: inline-block; }
@keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

.score-wrap { display: flex; align-items: center; justify-content: center; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; text-align: center; }
.score-ring {
  width: 132px; height: 132px; border-radius: 50%; flex: none;
  display: grid; place-items: center; position: relative;
  background: conic-gradient(var(--accent) calc(var(--pct) * 1%), var(--line) 0);
}
.score-ring::before { content: ""; position: absolute; inset: 12px; background: var(--bg); border-radius: 50%; }
.score-ring span { position: relative; font-family: var(--font-display); font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; }
.missed { list-style: none; padding: 0; margin: 0 0 24px; display: grid; gap: 12px; }
.missed li { border: 1px solid var(--line); border-left: 4px solid var(--bad); border-radius: 6px; padding: 14px 16px; background: var(--surface); }
.missed .q { font-weight: 600; margin: 0 0 8px; }
.missed .row { font-size: 15px; margin: 0; overflow-wrap: anywhere; }
.missed .row b { font-weight: 600; }
.missed .yours { color: var(--bad); }
.missed .right { color: var(--good); }
.perfect { background: var(--good-bg); border: 1px solid var(--good); color: var(--good); padding: 14px 16px; border-radius: 6px; font-weight: 600; margin-bottom: 24px; }
.actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

@media (max-width: 480px) {
  .logo-raveis { width: 190px; }
  .logo-cloze { width: 80px; }
  body { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>

<script>
const QUESTIONS = [
  // SkySlope
  { sec: "SkySlope", q: "What is a benefit of starting a SkySlope Forms file from Cloze?", o: ["Cloze can pass contact and property details into the forms file, reducing retyping", "Cloze guarantees that every form meets all legal requirements", "Cloze automatically signs the documents for the client", "Cloze removes the need to review the completed forms"], a: 0 },
  { sec: "SkySlope", q: "A contact already has a linked SkySlope Forms file. Which action opens it?", o: ["Prepare Open House", "Start Buyer Agreement", "Insert MAXA Designs", "View Form File"], a: 3 },
  { sec: "SkySlope", q: "Where do synced SkySlope listings and transactions appear in Cloze?", o: ["Agenda only", "The MAXA Designs folder", "Email templates", "Properties"], a: 3 },
  { sec: "SkySlope", q: "Which menu provides access to supported SkySlope Forms actions from a Cloze contact or property?", o: ["Keep in Touch", "Bulk Change", "Transact", "Recent Open House Visits"], a: 2 },
  { sec: "SkySlope", q: "When starting a listing agreement through the SkySlope Forms integration, what information does Cloze need to create the forms file?", o: ["Only the agent's name and email", "A property and at least one client", "Only the property's MLS number", "A completed open house attendance list"], a: 1 },
  // MAXA
  { sec: "MAXA", q: "What is the main purpose of connecting MAXA Designs to Cloze?", o: ["To synchronize transaction deadlines", "To collect open house registrations", "To assign contact relationship stages", "To make MAXA graphics and HTML newsletters available for use in Cloze emails"], a: 3 },
  { sec: "MAXA", q: "You want to include a MAXA newsletter in a Cloze marketing email to your clients. Which approach is supported?", o: ["Convert the newsletter into a contact record", "Upload the newsletter to SkySlope first", "Insert the MAXA HTML newsletter into the Cloze email from MAXA", "Rebuild every newsletter manually as plain text"], a: 2 },
  { sec: "MAXA", q: "Where can MAXA images be used within Cloze?", o: ["Only in contact profile photos", "In personal emails and marketing emails", "Only in property notes", "Only in internal team messages"], a: 1 },
  { sec: "MAXA", q: "What menu can you check Open Rates for your digital MAXA emails?", o: ["Analytics", "People", "Settings", "Library"], a: 0 },
  // General Knowledge
  { sec: "General Knowledge", q: "What is the purpose of a “Blast from the past” reminder?", o: ["To restore deleted contacts", "To resend an old newsletter automatically", "To reconnect with someone who used to be important but has fallen out of touch", "To display previously sold properties"], a: 2 },
  { sec: "General Knowledge", q: "What is the purpose of Next Steps in a contact's relationship section?", o: ["To display nearby open houses", "To create marketing graphics", "To manage account permissions", "To track completed and remaining actions in a repeatable checklist"], a: 3 },
  { sec: "General Knowledge", q: "Where do Cloze's keep-in-touch reminders appear?", o: ["Properties", "Agenda", "Library", "Account Settings"], a: 1 },
  { sec: "General Knowledge", q: "Which combination determines how often Cloze sends recurring keep-in-touch reminders for a relationship?", o: ["Email provider and device type", "Stage and Segment", "Property address and listing price", "Contact name and phone number"], a: 1 },
  { sec: "General Knowledge", q: "What does a contact's Segment describe?", o: ["Where the contact is in the client journey", "How often the contact opens emails", "Who the person is to you, such as a buyer or seller", "Which device the contact uses"], a: 2 },
  { sec: "General Knowledge", q: "What does a contact's Stage describe?", o: ["Where the person is in the client journey", "Which marketing template they receive", "Which geographic area they prefer", "How they originally found your website"], a: 0 },
  { sec: "General Knowledge", q: "You need to follow up with a buyer on a specific date. What should you use?", o: ["A new Segment", "A planned To Do reminder", "A MAXA design", "A property filter"], a: 1 },
  // Open House
  { sec: "Open House", q: "How do visitors use Self Service Check-In?", o: ["Scan a QR code with their own device", "Download the agent's contact database", "Sign in to the agent's Cloze account", "Submit a SkySlope form"], a: 0 },
  { sec: "Open House", q: "What happens to visitor information collected through the Open House App?", o: ["It is stored only on the visitor's phone", "It is automatically added to your Cloze database", "It is sent only to MAXA", "It must always be entered manually after the event"], a: 1 },
  { sec: "Open House", q: "Which setup describes Kiosk Mode?", o: ["Visitors check in through a MAXA newsletter", "Visitors must install Cloze on their phones", "Visitors complete a paper guest book for later import", "Visitors check in on an agent-provided tablet or laptop"], a: 3 },
  { sec: "Open House", q: "Where can you find people who attended an open house for a particular property?", o: ["Open the property, select More Actions, then Recent Open House Visits", "Open MAXA and select Design History", "Open Settings and select Connected Accounts", "Open SkySlope and select Broker Templates"], a: 0 }
];
const LETTERS = ["A", "B", "C", "D"];
const CHEERS = ["Correct! Nailed it!", "You got it!", "Boom! Right answer!", "Brilliant!", "That's the one!", "Look at you go!"];
const TRAINING_URL = "https://help.cloze.com/";
const RESULTS_URL = "https://script.google.com/macros/s/AKfycbwHVcXdNgn7ydU2jYwuy_7Q7G5Q-rM07KwGarmgZYkcPUG-PhvAsUb5csbuAw5-v04/exec";

const main = document.getElementById("main");
let idx = 0, score = 0, answers = [], attemptId = "";

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") n.className = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(c => n.append(c));
  return n;
}
function show(...nodes) {
  main.replaceChildren(...nodes);
  window.scrollTo(0, 0);
}

/* Anonymous result capture: one row per answered question, tied only to a random attempt ID. */
function sendResult(item, i, ok) {
  if (!RESULTS_URL) return;
  try {
    fetch(RESULTS_URL, {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ attemptId: attemptId, questionNumber: idx + 1, question: item.q, picked: LETTERS[i] + ". " + item.o[i], correct: ok })
    }).catch(function () {});
  } catch (e) {}
}

function start() {
  idx = 0; score = 0; answers = [];
  attemptId = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  show(
    el("h1", {}, "Cloze Knowledge Check"),
    el("p", { class: "lede" }, QUESTIONS.length + " questions covering SkySlope, MAXA, Open House App, and general overall questions. Pick an answer on each page. You'll see your score and any missed questions at the end."),
    el("p", { style: "font-size:15px;color:var(--muted)" }, "Your answers are anonymous. Only the result for each question is recorded, never your name or email."),
    el("button", { class: "btn center-btn", id: "startBtn", onclick: renderQuestion }, "Start the quiz")
  );
  document.getElementById("startBtn").focus();
}

function renderQuestion() {
  const item = QUESTIONS[idx];
  const opts = el("div", { class: "options", role: "group", "aria-label": "Answer choices" });
  const feedback = el("div", { class: "feedback" });
  const buttons = item.o.map((text, i) => {
    const b = el("button", { class: "opt", type: "button", id: "opt" + i },
      el("span", { class: "letter" }, LETTERS[i]),
      el("span", { class: "txt" }, text));
    b.addEventListener("click", () => choose(i, buttons, feedback));
    return b;
  });
  buttons.forEach(b => opts.append(b));

  show(
    el("div", { class: "progress" },
      el("div", { class: "bar" }, Object.assign(el("i"), { style: "width:" + (idx / QUESTIONS.length * 100) + "%" })),
      el("span", { class: "count" }, "Question " + (idx + 1) + " of " + QUESTIONS.length)),
    el("p", { class: "eyebrow" }, item.sec),
    el("h2", {}, item.q),
    opts,
    feedback
  );
  requestAnimationFrame(() => { const bar = main.querySelector(".bar i"); if (bar) bar.style.width = ((idx + 1) / QUESTIONS.length * 100) + "%"; });
}

function choose(i, buttons, feedback) {
  const item = QUESTIONS[idx];
  const ok = i === item.a;
  answers.push({ picked: i, ok });
  sendResult(item, i, ok);
  buttons.forEach(b => b.disabled = true);
  const last = idx === QUESTIONS.length - 1;
  const next = el("button", { class: "btn", id: "nextBtn", onclick: () => { idx++; idx < QUESTIONS.length ? renderQuestion() : renderResults(); } }, last ? "See my results" : "Next question");

  if (ok) {
    score++;
    buttons[i].classList.add("correct");
    buttons.forEach((b, j) => { if (j !== i) b.classList.add("dim"); });
    const cheer = CHEERS[Math.floor(Math.random() * CHEERS.length)];
    feedback.replaceChildren(el("p", { class: "msg good" }, el("span", { class: "cheer" }, "🎉 " + cheer)), next);
    confetti();
  } else {
    buttons[i].classList.add("wrong");
    buttons[item.a].classList.add("correct", "reveal");
    buttons.forEach((b, j) => { if (j !== i && j !== item.a) b.classList.add("dim"); });
    feedback.replaceChildren(el("p", { class: "msg bad" }, "Not quite.", el("small", {}, "The correct answer is " + LETTERS[item.a] + ".")), next);
  }
  next.focus();
}

function renderResults() {
  const total = QUESTIONS.length;
  const pct = Math.round(score / total * 100);
  const missed = answers.map((a, i) => ({ a, i })).filter(x => !x.a.ok);
  const nodes = [
    el("p", { class: "eyebrow" }, "Quiz complete"),
    el("h1", {}, "Your results"),
    el("div", { class: "score-wrap" },
      Object.assign(el("div", { class: "score-ring", role: "img", "aria-label": pct + " percent" }, el("span", {}, pct + "%")), { style: "--pct:" + pct }),
      el("div", {},
        el("h2", { style: "margin-bottom:4px" }, "You scored " + score + " out of " + total),
        el("p", { class: "lede", style: "margin:0" }, missed.length ? (missed.length + " question" + (missed.length > 1 ? "s" : "") + " to review below.") : "A perfect score.")))
  ];
  if (!missed.length) {
    nodes.push(el("p", { class: "perfect" }, "🏆 You answered every question correctly. Nothing to review!"));
  } else {
    nodes.push(el("h2", { style: "font-size:22px" }, "Questions you missed"));
    nodes.push(el("ul", { class: "missed" }, missed.map(({ a, i }) => {
      const q = QUESTIONS[i];
      return el("li", {},
        el("p", { class: "q" }, "Question " + (i + 1) + ": " + q.q),
        el("p", { class: "row yours" }, el("b", {}, "Your answer: "), LETTERS[a.picked] + ". " + q.o[a.picked]),
        el("p", { class: "row right" }, el("b", {}, "Correct answer: "), LETTERS[q.a] + ". " + q.o[q.a]));
    })));
  }
  nodes.push(
    el("p", {}, "Want to keep learning? Visit the Cloze Training website for guides and how-to articles."),
    el("div", { class: "actions" },
      el("a", { class: "btn", href: TRAINING_URL, target: "_blank", rel: "noopener" }, "Go to Cloze Training"),
      el("button", { class: "btn ghost", type: "button", onclick: start }, "Retake the quiz")),
    el("p", { style: "margin-top:12px;font-size:14px;color:var(--muted)" }, TRAINING_URL)
  );
  show(...nodes);
  if (!missed.length) confetti();
}

/* Confetti burst on the full-screen canvas */
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("fx"), ctx = c.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ["#3a85b9", "#8c1d4f", "#f2a900", "#e8602c", "#1fb5b0", "#1d7a4a"];
  const parts = [];
  for (let k = 0; k < 140; k++) {
    const side = k % 2 ? 1 : -1;
    parts.push({
      x: innerWidth / 2 + side * 20, y: innerHeight * 0.55,
      vx: (Math.random() * 9 + 2) * side * (Math.random() < .5 ? 1 : -1) * 0.9 + (Math.random() - .5) * 6,
      vy: -(Math.random() * 14 + 6),
      w: Math.random() * 8 + 5, h: Math.random() * 5 + 3,
      r: Math.random() * 6, vr: (Math.random() - .5) * .4,
      col: colors[k % colors.length], life: 0
    });
  }
  const t0 = performance.now();
  (function tick(now) {
    const t = now - t0;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => {
      p.vy += 0.38; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - t / 2600);
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (t < 2600) requestAnimationFrame(tick); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

start();
</script>
